      <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .modal {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h2 { text-align: center; }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    .switch { text-align: center; margin-top: 10px; cursor: pointer; color: blue; }
  </style>
</head>
<body>
  <div class="modal">
    <h2 id="formTitle">Admin Login</h2>
    <form id="authForm" method="POST" action="admin_auth.php">
      <input type="hidden" name="action" id="action" value="login">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="switch" onclick="toggleForm()">New Admin? Signup</div>
  </div>

  <script>
    function toggleForm() {
      const action = document.getElementById('action');
      const title = document.getElementById('formTitle');
      const btn = document.querySelector('button');
      const switcher = document.querySelector('.switch');

      if (action.value === "login") {
        action.value = "signup";
        title.textContent = "Admin Signup";
        btn.textContent = "Signup";
        switcher.textContent = "Already have account? Login";
      } else {
        action.value = "login";
        title.textContent = "Admin Login";
        btn.textContent = "Login";
        switcher.textContent = "New Admin? Signup";
      }
    }
  </script>
</body>
</html>
